<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>archview · 架构浏览器</title>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --ink: #0f172a; --muted: #64748b;
    --line: #e2e8f0; --accent: #2563eb; --soft: #eff6ff; --code: #f1f5f9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 18px;
    flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
    background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 3;
  }
  .brand { display: flex; align-items: baseline; gap: 7px; white-space: nowrap; }
  .brand b { font-size: 15px; }
  .brand span { color: var(--muted); font-size: 11px; letter-spacing: .04em; }
  #crumb {
    display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px;
    flex: 0 0 auto; white-space: nowrap;
  }
  #crumb b { color: var(--ink); font-weight: 600; }
  #crumb .sep { color: #cbd5e1; }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .tools input[type="search"] {
    flex: 0 0 240px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); font: inherit; color: inherit; outline: none;
  }
  .tools input[type="search"]:focus { border-color: var(--accent); background: #fff; }
  .tools button {
    flex: 0 0 auto; white-space: nowrap;
    padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: #334155; font: inherit; cursor: pointer;
  }
  .tools button:hover { border-color: #bfdbfe; background: var(--soft); }
  .tools select {
    flex: 0 0 auto; white-space: nowrap;
    padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: #334155; font: inherit; cursor: pointer;
  }
  .check { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; white-space: nowrap; flex: 0 0 auto; }
  #status { color: var(--muted); font-size: 12px; white-space: nowrap; flex: 0 0 auto; }
  .warnings { padding: 6px 14px; font-size: 12px; color: #92400e; background: #fffbeb;
    border-bottom: 1px solid #fde68a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .warnings.cycles { color: #991b1b; background: #fef2f2; border-bottom-color: #fecaca; }
  main { display: flex; height: calc(100vh - 56px); }
  #canvas {
    position: relative;
    position: relative; flex: 1; min-width: 0; overflow: hidden;
    background-color: var(--bg);
    background-image: radial-gradient(#dbe3ec 1px, transparent 1px);
    background-size: 24px 24px;
  }
  #svg { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #svg.grabbing { cursor: grabbing; }
  #hint {
    position: absolute; left: 14px; bottom: 12px; color: #94a3b8; font-size: 11px;
    background: rgba(255,255,255,.86); padding: 3px 8px; border-radius: 6px; pointer-events: none;
  }
  aside {
    width: 390px; flex: none; overflow: auto; padding: 18px 20px 60px;
    background: var(--panel); border-left: 1px solid var(--line);
  }
  aside h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; }
  aside h3 { margin: 22px 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .meta { color: var(--muted); font-size: 12px; }
  .doc { color: #334155; margin: 10px 0 0; }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    font-weight: 600; background: #e0e7ff; color: #3730a3; vertical-align: middle;
  }
  .badge.iface { background: #fef3c7; color: #b45309; }
  .badge.type { background: #dcfce7; color: #166534; }
  .badge.diff { background: #ffedd5; color: #c2410c; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--code); color: #334155; border-radius: 999px; padding: 2px 9px; font-size: 12px; }
  .pkg-list { list-style: none; margin: 10px 0 0; padding: 0; }
  .pkg-list li { border-bottom: 1px solid var(--line); }
  .pkg-list a { display: flex; justify-content: space-between; gap: 10px; padding: 9px 2px; color: var(--ink); }
  .pkg-list a:hover { text-decoration: none; background: var(--soft); }
  .pkg-list .count { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 12.5px; }
  th { background: #f8fafc; color: var(--muted); font-weight: 600; font-size: 11px; }
  tr:last-child td { border-bottom: 0; }
  td.name { white-space: nowrap; font-weight: 600; }
  code.sig { background: var(--code); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .rel { display: grid; gap: 8px; }
  .rel ul { margin: 0; padding-left: 18px; }
  .rel li { margin: 2px 0; }
  .empty { color: var(--muted); font-style: italic; }
  .src {
    display: inline-block; margin-top: 14px; padding: 7px 12px; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 13px;
  }
  .src:hover { text-decoration: none; filter: brightness(1.05); }
  .err { color: #b91c1c; }
  .node { cursor: pointer; }
  .node.dim { opacity: .2; }
  mark { background: #fef08a; color: inherit; padding: 0 1px; border-radius: 3px; }
  tr.sel td { background: var(--soft); }
  .node text { pointer-events: none; user-select: none; }
  .node .box { stroke-width: 1.5; }
  .node .title { font-size: 13px; font-weight: 600; fill: #0f172a; }
  .node .row { font-size: 11px; fill: #334155; font-family: ui-monospace, Consolas, monospace; }
  .node .kind { font-size: 9px; fill: #64748b; }
  .node:hover .box { stroke: #0284c7; }
  .node.selected .box { stroke: #16a34a; stroke-width: 3; }
  .edge { fill: none; stroke: #94a3b8; stroke-width: 1.4; }
  .edge.ref { stroke: #8b5cf6; stroke-dasharray: 4 3; }
  .edge.call { stroke: #0891b2; }
  .edge.call.dynamic { stroke-dasharray: 3 3; }
  .edge.callonly { stroke: #0d9488; stroke-dasharray: 6 3; }
  .edge.impl { stroke: #16a34a; }
  .edge.hl { stroke-width: 2.6; }
  .edge.faded { opacity: .18; }
  .edge.emb { stroke: #2563eb; }
  /* A layout-induced cross-row hop: neutral grey, never a cycle. */
  .edge.span { stroke: #94a3b8; stroke-dasharray: 2 3; }
  /* A reference to a package-level const/var. Solid and distinct from a type
     reference; a cycle below still overrides it. */
  .edge.value { stroke: #b45309; stroke-dasharray: none; }
  /* A layer violation keeps its red line even when wrapping stretched it. */
  .edge.violation { stroke: #dc2626; stroke-width: 1.9; }
  /* Last: a cycle is the strongest fact, red dashed even when it is also a
     call or a violation. */
  .edge.cycle { stroke: #dc2626; stroke-dasharray: 2 4; }
  .badge-svg { font-size: 9px; fill: #475569; }
  .crap { padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .crap.ok { background: #dcfce7; color: #166534; }
  .crap.warn { background: #fef3c7; color: #92400e; }
  .crap.bad { background: #fee2e2; color: #991b1b; }
  .legend { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .cardhelp {
    position: absolute; right: 12px; bottom: 12px; z-index: 5; display: block;
    background: rgba(255,255,255,.92);
    max-height: 62vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(15,23,42,.12); padding: 8px 12px; font-size: 11px; color: #334155;
  }
  .cardhelp.open { display: block; }
  .cardhelp h4 { margin: 2px 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .cardhelp div { margin: 5px 0; white-space: nowrap; }
  .cardhelp .sw { display: inline-block; width: 12px; height: 12px; margin-right: 8px;
    border-radius: 3px; border: 1px solid #94a3b8; vertical-align: -2px; }
  .cardhelp code { font-size: 11px; color: #475569; }
  .cardhelp .ln { display: inline-block; width: 18px; height: 0; margin: 0 4px 0 8px;
    border-top: 2px solid #94a3b8; vertical-align: 2px; }
  .cardhelp small { font-size: 10px; color: #64748b; }
  .cardhelp .swline { display: inline-block; width: 26px; height: 0; margin-right: 8px;
    border-top: 2px solid #94a3b8; vertical-align: 3px; }
  .legend b { font-weight: 600; }
  .legend b.ok { color: #166534; }
  .legend b.warn { color: #92400e; }
  .legend b.bad { color: #991b1b; }
  .node .crap-text { font-size: 10px; font-weight: 600; }
  .node .fold { font-size: 10px; fill: #64748b; cursor: pointer; }
  @media (max-width: 980px) {
    aside { width: 330px; }
    .tools input[type="search"] { width: 160px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><b id="brand">archview</b><span>ARCHVIEW</span></div>
  <nav id="crumb"></nav>
  <div class="tools">
    <input id="q" type="search" placeholder="搜索类型 / 函数…（/）" autocomplete="off">
    <label class="check"><input id="all" type="checkbox"> 含未导出</label>
    <label class="check"><input id="calls" type="checkbox"> 调用边</label>
    <button id="fit" type="button">适应</button>
    <button id="reload" type="button">重载</button>
    <span id="legend" class="legend" hidden>CRAP 低 <b class="ok">≤5</b> · 中 <b class="warn">≤30</b> · 高 <b class="bad">&gt;30</b></span>
    <span id="status"></span>
  </div>
</header>
<div id="warnings" class="warnings" hidden></div>
<div id="cyclewarn" class="warnings cycles" hidden></div>

<main>
  <section id="canvas">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hint">拖拽平移 · 滚轮缩放 · 单击选中 · 双击进入/查看源码</div>
    <div id="cardhelp" class="cardhelp" aria-label="样式说明">
      <div><b>卡片</b> <span class="sw" style="background:#dbeafe;border-color:#3b82f6"></span>类型
        <span class="sw" style="background:#fef3c7;border-color:#d97706"></span>接口
        <span class="sw" style="background:#f1f5f9;border-color:#64748b"></span>函数
        <span class="sw" style="background:#f0fdf4;border-color:#16a34a"></span>变量</div>
      <div><b>标记</b> <span class="sw" style="background:#ecfeff;border-color:#0e7490"></span>入口
        <span class="sw" style="background:#fff;border-color:#ea580c"></span>改动</div>
      <div><b>连线</b>
        <span class="ln" style="border-top-color:#94a3b8" title="包依赖"></span><small>依赖</small>
        <span class="ln" style="border-top-color:#8b5cf6;border-top-style:dashed" title="字段/签名引用"></span><small>uses</small>
        <span class="ln" style="border-top-color:#16a34a" title="实现接口"></span><small>implements</small>
        <span class="ln" style="border-top-color:#2563eb" title="嵌入"></span><small>embeds</small>
        <span class="ln" style="border-top-color:#b45309" title="函数/方法体或初始化式引用常量/变量"></span><small>引用常量/变量</small>
        <span class="ln" style="border-top-color:#0891b2" title="静态调用;虚线为接口调用"></span><small>调用</small>
        <span class="ln" style="border-top-color:#dc2626;border-top-width:3px" title="分层违规:下层依赖上层"></span><small>违规</small></div>
      <div><b>跨包</b> <span class="ln" style="border-top-color:#0d9488;border-top-style:dashed" title="跨包调用,且两包之间没有同向 import"></span><small>跨包调用(无 import)</small></div>
      <div><b>环 / 跨行</b>
        <span class="ln" style="border-top-color:#94a3b8;border-top-style:dashed" title="wrapRows 把同一/相邻层拆成多行造成的跨行边,不是环"></span><small>跨行(换行)</small>
        <span class="ln" style="border-top-color:#dc2626;border-top-style:dashed" title="强连通分量内部的边:依赖图上真的存在环"></span><small>环(强连通)</small></div>
    </div>  </section>
  <aside id="side"></aside>
</main>
<!-- archview:data -->
<script src="/ui.js"></script>
<script>
(function () {
  "use strict";

  // The page has one owner per concern:
  //
  //   state/model   — the fetched model, its index and the view flags
  //   drawing       — markers, cards (drawNode/CARD_STYLE), edge paths,
  //                   transform and fit
  //   inspector     — a thin DOM sink for A.panelFor / search
  //   binding       — every DOM event, delegated through #svg
  //
  // Everything that can be decided without a document lives in ui.js; this
  // file only maps that result onto SVG and HTML.
  var A = window.ArchView;
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("svg");
  var side = document.getElementById("side");
  var crumb = document.getElementById("crumb");
  var statusEl = document.getElementById("status");
  var qEl = document.getElementById("q");
  var allEl = document.getElementById("all");

  var esc = A.esc, cut = A.cut, short = A.short;
  var pkgHash = A.pkgHash, typeHash = A.typeHash;

  var CRAP_FILL = { ok: "#dcfce7", warn: "#fef3c7", bad: "#fee2e2" };
  var CRAP_INK = { ok: "#166534", warn: "#92400e", bad: "#991b1b" };

  var state = {
    model: null, all: false, q: "", route: { view: "home" }, sel: "",
    collapsed: [], expanded: [], calls: false,
    hits: [], hitIndex: 0,
    tx: 0, ty: 0, k: 1, sceneKey: "", scene: null,
    cards: new Map()
  };

  var idx = { pkgByPath: new Map(), typeById: new Map(), incoming: new Map(), funcByID: new Map(), valueByID: new Map() };

  function rel(p) { return A.relPath(state.model && state.model.path, p); }
  function vis(list) { return A.visible(list, state.all); }

  // ---------- model fetch ----------

  async function fetchModel() {
    if (window.__ARCHVIEW_DATA__) {
      // Single-file export (4.1): the model is inlined and there is no server.
      state.model = window.__ARCHVIEW_DATA__;
      document.getElementById("reload").style.display = "none";
    } else {
      statusEl.textContent = "扫描中…";
      var r = await fetch("/model.json", { cache: "no-store" });
      if (!r.ok) throw new Error(await r.text());
      state.model = await r.json();
    }
    document.getElementById("brand").textContent = short(state.model.path);
    idx = A.indexModel(state.model);
    updateStatus();
    renderWarnings();
  }

  // renderWarnings puts the model's warnings on screen. A step that failed
  // (go-crap, git diff, a package that does not type-check) only says so here;
  // hiding them made a missing feature look like a missing bug.
  function renderWarnings() {
    var box = document.getElementById("warnings");
    if (!box) return;
    var w = A.warningSummary(state.model);
    if (!w) { box.hidden = true; return; }
    box.hidden = false;
    box.textContent = "⚠ " + w.count + " 条警告 · " + w.text;
    box.title = w.all;
  }

  function updateStatus() {
    if (!state.model) return;
    var types = 0, funcs = 0;
    state.model.packages.forEach(function (p) {
      types += vis(p.types).length; funcs += vis(p.funcs).length;
    });
    statusEl.textContent = state.model.packages.length + " 包 · " + types + " 类型 · " + funcs + " 函数";
    if (state.model.diff) {
      var d = state.model.diff;
      statusEl.textContent += " · 改动 " + d.files + " 文件 / " + d.functions + " 函数";
      statusEl.title = "相对 " + d.ref + " 的工作区改动";
    }
    var legend = document.getElementById("legend");
    legend.hidden = !state.model.metrics;
    if (state.model.metrics) {
      var t = A.crapThresholds(state.model);
      legend.innerHTML = "CRAP 低 <b class=\"ok\">≤" + t[0] + "</b> · 中 <b class=\"warn\">≤" + t[1] +
        "</b> · 高 <b class=\"bad\">&gt;" + t[1] + "</b>";
      legend.title = "类型按其最差方法的 CRAP 着色;阈值可在 archview.json 的 metrics.thresholds 里改";
    }
  }

  // renderCycleWarning shows the scene's SCC line: a graph with a cycle says so
  // before the reader traces lines. It is one deterministic line built in
  // ui.js (A.cycleWarning via buildScene) and is hidden again on a DAG.
  function renderCycleWarning(scene) {
    var box = document.getElementById("cyclewarn");
    if (!box) return;
    var text = scene && scene.cycleWarning;
    if (!text) {
      box.hidden = true;
      box.textContent = "";
      return;
    }
    box.hidden = false;
    box.textContent = "⚠ " + text;
    box.title = text;
  }

  // ---------- routing ----------

  function go(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
  }

  // cardIndex is the one map from a declaration ID to its canvas card. The
  // renderer, the delegated click handler and the double-click handler all
  // read the same map, so a card cannot behave differently from its panel.
  function cardIndex(scene) {
    var cards = new Map();
    (scene ? scene.nodes : []).forEach(function (n) { cards.set(n.id, n); });
    return cards;
  }

  // ---------- drawing ----------

  // One helper creates every SVG element. Nothing else calls
  // document.createElementNS, so namespaces and attribute wiring live here.
  function svgEl(name, attrs, text) {
    var n = document.createElementNS(NS, name);
    if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  // One marker per line style: the arrow carries the relation colour.
  var MARKERS = [
    { id: "arrow", fill: "#94a3b8" },
    { id: "arrow-ref", fill: "#8b5cf6" },
    { id: "arrow-impl", fill: "#16a34a" },
    { id: "arrow-emb", fill: "#2563eb" },
    { id: "arrow-call", fill: "#0891b2" },
    { id: "arrow-callonly", fill: "#0d9488" },
    { id: "arrow-value", fill: "#b45309" },
    { id: "arrow-violation", fill: "#dc2626" },
    { id: "arrow-span", fill: "#94a3b8" },
    { id: "arrow-cycle", fill: "#dc2626" }
  ];

  function markerFor(e) {
    if (e.cycle) return "arrow-cycle";
    if (e.violation) return "arrow-violation";
    if (e.kind === "value") return "arrow-value";
    if (e.span) return "arrow-span";
    if (e.callOnly) return "arrow-callonly";
    if (e.call) return "arrow-call";
    if (e.kind === "implements") return "arrow-impl";
    if (e.kind === "embeds") return "arrow-emb";
    if (e.ref) return "arrow-ref";
    return "arrow";
  }

  // edgeClass names the relation so the CSS owns the look.
  var edgeEls = [];

  function edgeClass(e) {
    var cls = "edge";
    if (e.ref) cls += " ref";
    if (e.kind === "implements") cls += " impl";
    if (e.kind === "embeds") cls += " emb";
    if (e.kind === "value") cls += " value";
    if (e.callOnly) cls += " callonly";
    if (e.call) cls += " call" + (e.dynamic ? " dynamic" : "");
    if (e.span) cls += " span";
    if (e.violation) cls += " violation";
    if (e.cycle) cls += " cycle";
    return cls;
  }

  // highlightEdges is the one selection mechanism on the canvas: the edges
  // that touch the selected card stay in front, the rest recede. With nothing
  // selected every edge keeps its base class.
  function highlightEdges(selected) {
    edgeEls.forEach(function (it) {
      if (!it.el) return;
      var touch = it.from === selected || it.to === selected;
      it.el.setAttribute("class", it.cls + (selected ? (touch ? " hl" : " faded") : ""));
    });
  }

  // drawEdges routes every scene edge from its two cards. Every route leaves a
  // bottom centre and enters a top centre; the port decision lives in
  // A.edgePath, not here. A cycle or span edge keeps that same port pair and is
  // marked by its class and its own arrow colour.
  function drawEdges(scene, cards, world) {
    edgeEls = [];
    scene.edges.forEach(function (e) {
      var a = cards.get(e.from), b = cards.get(e.to);
      if (!a || !b) return;
      var cls = edgeClass(e);
      var p = svgEl("path", {
        d: A.edgePath(a, b),
        class: cls,
        "marker-end": "url(#" + markerFor(e) + ")"
      });
      edgeEls.push({ el: p, from: e.from, to: e.to, cls: cls });
      if (!e.ref) {
        // A native tooltip: the arrow leaves the dependent and points at the
        // thing it depends on. A callOnly edge names the absent import.
        var lead = e.cycle ? "环(强连通): " : (e.span ? "跨行(换行): " :
          (e.violation ? "违规依赖: " : (e.callOnly ? "跨包调用(无 import): " :
            (e.kind === "value" ? "引用常量/变量: " : ""))));
        p.appendChild(svgEl("title", {}, lead + e.from + " → " + e.to));
      }
      world.appendChild(p);
    });
    highlightEdges(scene.selected);
  }

  // Per-kind card colours. buildCard keeps an interface's kind "interface", so
  // the table alone picks the style; no capability branches.
  var CARD_STYLE = {
    type: { fill: "#dbeafe", stroke: "#3b82f6" },
    interface: { fill: "#fef3c7", stroke: "#d97706" },
    func: { fill: "#f1f5f9", stroke: "#64748b" },
    value: { fill: "#f0fdf4", stroke: "#16a34a" },
    pkg: { fill: "#e0e7ff", stroke: "#6366f1" }
  };

  // drawNode is the one card renderer: buildCard (ui.js) has already defaulted
  // every field, so this only maps a node onto SVG pieces. The kind checks that
  // remain are the three things that genuinely differ: style, row baseline and
  // the fold handle. It attaches no listeners; the delegated handler in the
  // binding section owns every click.
  function drawNode(n) {
    var isDecl = n.kind === "type" || n.kind === "interface";
    var g = svgEl("g", {
      class: "node" + (n.selected ? " selected" : "") + (n.dim ? " dim" : ""),
      "data-id": n.id
    });
    // Hover text: the card truncates, the tooltip does not.
    g.appendChild(svgEl("title", {}, n.title + (n.sub ? " — " + n.sub : "") +
      (n.more > 0 ? " (还有 " + n.more + " 条,点击展开)" : "")));
    var style = CARD_STYLE[n.kind] || CARD_STYLE.type;
    // -diff marks a declaration: the accent stroke stands out without hiding
    // everything else.
    g.appendChild(svgEl("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 9,
      fill: style.fill, stroke: n.changed ? "#ea580c" : style.stroke, class: "box" }));
    g.appendChild(svgEl("text", { x: n.x + 12, y: n.y + 20, class: "title" }, cut(n.title, 26)));
    if (n.changed) {
      g.appendChild(svgEl("circle", { cx: n.x + 6, cy: n.y + 6, r: 4, fill: "#ea580c", class: "changed-dot" }));
    }
    g.appendChild(svgEl("text", { x: n.x + 12, y: n.y + (isDecl ? 34 : 36), class: "kind" },
      cut(n.sub, 40)));
    if (n.rows && n.rows.length) {
      var base = isDecl ? 34 : 54;
      var step = isDecl ? 17 : 16;
      n.rows.forEach(function (row, i) {
        g.appendChild(svgEl("text", { x: n.x + 12, y: n.y + base + (isDecl ? 16 : 0) + i * step, class: "row" },
          cut(row, isDecl ? 42 : 40)));
      });
      if (n.more > 0) {
        var moreText = svgEl("text", { x: n.x + 12, y: n.y + base + 16 + n.rows.length * step, class: "kind",
          style: "pointer-events: all; cursor: pointer; text-decoration: underline", fill: "#2563eb",
          "data-action": "more" },
          "… 还有 " + n.more + " 条(点击查看详情)");
        g.appendChild(moreText);
      }
    }
    if (n.entry) {
      g.appendChild(svgEl("rect", { x: n.x + n.w - 46, y: n.y + 7, width: 38, height: 17, rx: 8,
        fill: "#ecfeff", class: "entry-badge" }));
      g.appendChild(svgEl("text", { x: n.x + n.w - 27, y: n.y + 19.5, class: "entry-text",
        fill: "#0e7490", "text-anchor": "middle" }, "入口"));
    }
    if (n.crap != null) {
      // CRAP badge: a type is as risky as its worst method (2.3), a package as
      // risky as its worst declaration. Leave room for the entry badge.
      var lvl = A.crapLevel(n.crap, A.crapThresholds(state.model));
      var bx = n.x + n.w - (n.entry ? 110 : 54);
      g.appendChild(svgEl("rect", { x: bx, y: n.y + 7, width: 46, height: 17, rx: 8,
        fill: CRAP_FILL[lvl], class: "crap-badge" }));
      g.appendChild(svgEl("text", { x: bx + 23, y: n.y + 19.5, class: "crap-text",
        fill: CRAP_INK[lvl], "text-anchor": "middle" }, A.formatCrap(n.crap)));
    }
    if (isDecl) {
      // Fold toggle (3.2): collapsed cards keep their title only.
      g.appendChild(svgEl("text", { x: n.x + n.w - 16, y: n.y + n.h - 8, class: "fold",
        "data-action": "fold" }, n.folded ? "▸" : "▾"));
    }
    return g;
  }

  function draw(scene) {
    svg.innerHTML = "";
    var defs = svgEl("defs");
    MARKERS.forEach(function (m) {
      var marker = svgEl("marker", {
        id: m.id, viewBox: "0 0 10 10", refX: "9", refY: "5",
        markerWidth: "9", markerHeight: "9", markerUnits: "userSpaceOnUse",
        overflow: "visible", orient: "auto-start-reverse"
      });
      marker.appendChild(svgEl("path", { d: "M0,0 L10,5 L0,10 z", fill: m.fill }));
      defs.appendChild(marker);
    });
    svg.appendChild(defs);

    var world = svgEl("g", { id: "world" });
    svg.appendChild(world);

    var cards = cardIndex(scene);
    state.cards = cards;
    drawEdges(scene, cards, world);
    scene.nodes.forEach(function (n) { world.appendChild(drawNode(n)); });

    applyTransform();
  }

  function applyTransform() {
    var world = svg.querySelector("#world");
    if (world) world.setAttribute("transform", "translate(" + state.tx + " " + state.ty + ") scale(" + state.k + ")");
  }

  function fit(scene) {
    if (!scene || !scene.nodes.length) {
      state.tx = 0; state.ty = 0; state.k = 1; applyTransform(); return;
    }
    var t = A.fitTransform(scene.nodes, svg.clientWidth, svg.clientHeight);
    state.k = t.k;
    state.tx = t.tx;
    state.ty = t.ty;
    applyTransform();
  }

  // ---------- inspector ----------

  function renderCrumb() {
    var r = state.route;
    if (r.view === "home") { crumb.innerHTML = "<b>模块总览</b>"; return; }
    var pkg = A.routePkg(r, idx);
    if (!pkg) { crumb.innerHTML = '<a href="#/">模块总览</a>'; return; }
    var html = '<a href="#/">模块总览</a><span class="sep">/</span>';
    if (r.view === "pkg") {
      html += "<b>" + esc(rel(pkg.path)) + "</b>";
    } else {
      html += '<a href="' + pkgHash(pkg.path) + '">' + esc(rel(pkg.path)) + '</a><span class="sep">/</span><b>' +
        esc(short(r.id.split("#").pop())) + "</b>";
    }
    crumb.innerHTML = html;
  }

  // renderSide is the only DOM sink for a declaration panel. The frame and the
  // per-kind sections are pure functions in ui.js, so the same HTML is covered
  // by node --test.
  function renderSide(scene) {
    if (state.q) { renderSearch(); return; }
    side.innerHTML = A.panelFor(state.route, scene, {
      model: state.model,
      idx: idx,
      all: state.all,
      from: location.hash || "#/",
      selected: state.sel
    });
  }

  function renderSearch() {
    if (!state.model) return;
    var hits = A.searchHits(state.model, state.q, state.all);
    state.hits = hits;
    if (state.hitIndex >= hits.length) state.hitIndex = 0;

    var html = "<h2>搜索</h2><div class=\"meta\">“" + esc(state.q) + "” · " + hits.length + " 个结果";
    if (hits.length) html += " · ↑↓ 选择 · Enter 打开";
    html += "</div>";
    if (!hits.length) html += '<p class="empty">没有匹配</p>';
    else {
      html += "<table><thead><tr><th>类型</th><th>名字</th></tr></thead><tbody>";
      hits.slice(0, 80).forEach(function (h, i) {
        html += "<tr" + (i === state.hitIndex ? ' class="sel"' : "") + "><td>" + esc(h.kind) +
          '</td><td class="name"><a href="' + h.href + '">' + A.highlight(h.name, state.q) + "</a></td></tr>";
      });
      html += "</tbody></table>";
    }
    side.innerHTML = html;
  }

  function moveHit(delta) {
    if (!state.hits || !state.hits.length) return;
    state.hitIndex = (state.hitIndex + delta + state.hits.length) % state.hits.length;
    renderSearch();
  }

  function openHit() {
    var h = state.hits && state.hits[state.hitIndex];
    if (h) go(h.href);
  }

  // ---------- render loop ----------

  function render() {
    if (!state.model) return;
    state.route = A.parseHash(location.hash);
    renderCrumb();
    var scene = A.buildScene(state.model, idx, state.route, state.all, {
      collapsed: state.collapsed,
      expanded: state.expanded,
      calls: state.calls,
      query: state.q,
      selected: state.sel
    });
    if (!scene) {
      go("#/");
      return;
    }
    state.scene = scene;
    draw(scene);
    renderSide(scene);
    renderCycleWarning(scene);
    updateChrome();
    if (state.sceneKey !== scene.key) {
      state.sceneKey = scene.key;
      fit(scene);
    }
  }

  // updateChrome keeps the hint line in sync with the view state.
  function updateChrome() {
    var hint = document.getElementById("hint");
    hint.textContent =
      "拖拽平移 · 滚轮缩放 · 单击选中 · 双击进入/查看源码 · 自上而下" +
      (state.model.layers && state.model.layers.length ? " · 红线 = 内层依赖外层" : "") +
      (state.calls ? " · 蓝线 = 调用" : "") +
      " · 灰色虚线 = 换行造成的跨行 · 红色虚线 = 环(强连通) · 箭头指向被依赖方 · ▾ 折叠成员";
  }

  // ---------- binding ----------
  //
  // Every canvas interaction is delegated through #svg. drawNode returns a
  // plain group, so a card cannot own a handler that the next render forgets.

  function hasClass(node, cls) {
    return (" " + (node.getAttribute("class") || "") + " ").indexOf(" " + cls + " ") >= 0;
  }

  // closest walks the parent chain instead of relying on Element.closest, so
  // the same code works in the page and in the DOM shims used by smoke tests.
  function closest(target, match) {
    for (var n = target; n; n = n.parentNode) {
      if (n.nodeType === 1 && match(n)) return n;
    }
    return null;
  }

  function cardElement(target) {
    return closest(target, function (n) { return hasClass(n, "node") && n.getAttribute("data-id"); });
  }

  function actionElement(target) {
    return closest(target, function (n) { return n.getAttribute && n.getAttribute("data-action"); });
  }

  function handleCardClick(node) {
    var card = state.cards.get(node.getAttribute("data-id"));
    if (!card) return;
    // A card that is already the current view must not re-render: the
    // double-click below needs the element to stay alive.
    if (card.selected) return;
    // A package's select route is the module view itself; remember which box
    // was clicked so the module view can show it selected.
    if (card.href === "#/") state.sel = card.id;
    go(card.href);
  }

  function handleCardAction(action) {
    var node = cardElement(action);
    if (!node) return;
    var card = state.cards.get(node.getAttribute("data-id"));
    if (!card) return;
    var kind = action.getAttribute("data-action");
    if (kind === "fold") {
      state.collapsed = A.toggleCollapsed(state.collapsed, card.id);
      state.sceneKey = "";
      render();
    } else if (kind === "more") {
      // Open the inspector instead of growing the card: the layout stays put,
      // so the viewport and the zoom do not move.
      go(typeHash(card.id));
    }
  }

  function drill(card) {
    var href = card.drillHref;
    if (!href) return;
    if (href.charAt(0) === "#") { go(href); return; }
    if (href.indexOf("/source?") === 0) {
      if (!state.model.root) return; // an imported IR has no sources behind it
      href = A.withFrom(href, location.hash || "#/");
    }
    window.location.href = href;
  }

  function onCanvasClick(ev) {
    var action = actionElement(ev.target);
    if (action) { ev.stopPropagation(); handleCardAction(action); return; }
    var node = cardElement(ev.target);
    if (node) { ev.stopPropagation(); handleCardClick(node); return; }
    // Clicking the empty canvas clears the selection: otherwise a selected card
    // has no way back to the module overview.
    if (ev.target === svg && state.sel) {
      state.sel = "";
      render();
    }
  }

  function onCanvasDblClick(ev) {
    var node = cardElement(ev.target);
    if (!node) return;
    ev.stopPropagation();
    var card = state.cards.get(node.getAttribute("data-id"));
    if (card) drill(card);
  }

  var drag = null;
  svg.addEventListener("click", onCanvasClick);
  svg.addEventListener("dblclick", onCanvasDblClick);
  svg.addEventListener("mousedown", function (e) {
    if (cardElement(e.target) || actionElement(e.target)) return;
    drag = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty };
    svg.classList.add("grabbing");
    e.preventDefault();
  });
  window.addEventListener("mousemove", function (e) {
    if (!drag) return;
    state.tx = drag.tx + (e.clientX - drag.x);
    state.ty = drag.ty + (e.clientY - drag.y);
    applyTransform();
  });
  window.addEventListener("mouseup", function () {
    if (!drag) return;
    drag = null;
    svg.classList.remove("grabbing");
  });
  svg.addEventListener("wheel", function (e) {
    e.preventDefault();
    var rect = svg.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    var k2 = Math.min(3, Math.max(0.2, state.k * factor));
    state.tx = mx - (mx - state.tx) * (k2 / state.k);
    state.ty = my - (my - state.ty) * (k2 / state.k);
    state.k = k2;
    applyTransform();
  }, { passive: false });

  document.getElementById("fit").addEventListener("click", function () { fit(state.scene); });
  document.getElementById("reload").addEventListener("click", function () { boot(); });
  document.getElementById("calls").addEventListener("change", function (e) {
    state.calls = e.target.checked;
    state.sceneKey = "";
    render();
  });
  allEl.addEventListener("change", function () {
    state.all = allEl.checked;
    updateStatus();
    state.sceneKey = "";
    render();
  });
  qEl.addEventListener("input", function () {
    state.q = qEl.value.trim();
    state.hitIndex = 0;
    if (!state.model) return;
    // Re-render the scene too: the canvas fades whatever does not match.
    render();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
    if (state.q && e.key === "ArrowDown") { e.preventDefault(); moveHit(1); return; }
    if (state.q && e.key === "ArrowUp") { e.preventDefault(); moveHit(-1); return; }
    if (state.q && e.key === "Enter") { e.preventDefault(); openHit(); return; }
    if (e.key === "Escape") {
      if (document.activeElement === qEl) {
        qEl.value = ""; state.q = ""; state.hits = []; qEl.blur(); render();
        return;
      }
      // Escape clears a selected package card. There is only one Escape rule,
      // whether or not the page was focused on the search box.
      if (state.sel) { state.sel = ""; render(); }
    }
  });
  window.addEventListener("hashchange", function () {
    qEl.value = ""; state.q = "";
    state.hits = []; state.hitIndex = 0;
    render();
  });
  window.addEventListener("resize", function () { fit(state.scene); });

  // ---------- live reload (4.4) ----------

  var events = null;

  function connectEvents() {
    if (events || window.__ARCHVIEW_DATA__) return;
    if (typeof EventSource === "undefined") return;
    events = new EventSource("/events");
    events.addEventListener("reload", function () { boot(); });
    // EventSource reconnects on its own; without -watch the endpoint 404s and
    // the manual 重载 button stays the way to refresh.
    events.onerror = function () {};
  }

  // ---------- boot ----------

  async function boot() {
    try {
      await fetchModel();
      state.sceneKey = "";
      render();
      connectEvents();
    } catch (e) {
      statusEl.textContent = "扫描失败";
      side.innerHTML = '<p class="err">' + esc(e.message) + "</p>";
    }
  }

  boot();
})();
</script>
</body>
</html>
