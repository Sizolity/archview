name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser reads the tag history for the changelog
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # A tag is a published version, so the changelog has to describe it. See
      # RELEASING.md for the numbering rules this protects.
      - name: changelog entry exists
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[?${version}\]?( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section; see RELEASING.md"
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
